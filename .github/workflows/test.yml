name: Test & Lint

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate-extension:
    name: Validate Extension YAML & Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate extension.yml
        run: |
          python3 -c "
          import yaml, sys
          with open('extension.yml') as f:
              data = yaml.safe_load(f)
          assert data['schema_version'] == '1.0', 'Invalid schema_version'
          ext = data['extension']
          assert ext['id'] == 'evaluator', f'Invalid id: {ext[\"id\"]}'
          assert 'commands' in data['provides'], 'Missing commands'
          assert 'hooks' in data, 'Missing hooks'
          print(f'extension.yml valid: {ext[\"name\"]} v{ext[\"version\"]}')
          print(f'  commands: {len(data[\"provides\"][\"commands\"])}')
          print(f'  hooks: {len(data[\"hooks\"])}')
          "

      - name: Validate JSON schema
        run: |
          python3 -c "
          import json, sys
          with open('schemas/evaluator-result.schema.json') as f:
              schema = json.load(f)
          assert schema['\$schema'].startswith('https://json-schema.org/'), 'Invalid \$schema'
          assert schema['title'] == 'Evaluator Result', f'Invalid title: {schema[\"title\"]}'
          assert 'outcome' in schema['properties'], 'Missing outcome property'
          print(f'Schema valid: {schema[\"title\"]}')
          print(f'  required: {schema[\"required\"]}')
          "

      - name: Validate result template
        run: |
          python3 -c "
          import json, sys
          with open('templates/evaluator-result-template.json') as f:
              template = json.load(f)
          assert template['schema_version'] == '1.0', 'Invalid schema_version'
          assert 'evaluator' in template, 'Missing evaluator'
          assert 'findings' in template, 'Missing findings'
          print(f'Template valid: {len(template[\"findings\"])} sample finding(s)')
          "

  test-python:
    name: Test Python Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run compose_results.py --help
        run: python3 scripts/python/compose_results.py --help

      - name: Test compose with sample data
        run: |
          mkdir -p /tmp/test-results

          cat > /tmp/test-results/epistemic-after_plan-20260902T140000Z.json << 'ENDJSON'
          {
            "schema_version": "1.0",
            "evaluator": {"id": "epistemic", "version": "0.1.0", "name": "Epistemic Checker"},
            "phase": "after_plan",
            "outcome": "warn",
            "summary": "Two unsupported claims found.",
            "findings": [
              {"id": "EPI-001", "severity": "high", "kind": "unsupported_claim", "subject": "plan.md#REQ-014", "description": "No evidence.", "evidence_refs": [], "provenance_refs": ["plan.md#REQ-014"], "uncertainty": "medium", "recommended_action": "gather_evidence", "rationale": "No evidence."},
              {"id": "EPI-002", "severity": "medium", "kind": "ambiguous_requirement", "subject": "plan.md#REQ-022", "description": "Undefined term.", "evidence_refs": [], "provenance_refs": ["plan.md#REQ-022"], "uncertainty": "low", "recommended_action": "clarify", "rationale": "Undefined."}
            ],
            "next_action": {"kind": "warn", "target_phase": null, "message": "2 findings."},
            "metadata": {"timestamp": "2026-09-02T14:00:00Z", "duration_ms": 150, "artifacts_evaluated": ["plan.md"], "model": null, "deterministic": true},
            "state": {}
          }
          ENDJSON

          cat > /tmp/test-results/schema-validate-after_plan-20260902T140100Z.json << 'ENDJSON'
          {
            "schema_version": "1.0",
            "evaluator": {"id": "schema-validate", "version": "0.2.0", "name": "Schema Validator"},
            "phase": "after_plan",
            "outcome": "pass",
            "summary": "All artifacts conform.",
            "findings": [],
            "next_action": {"kind": "pass", "target_phase": null, "message": "All passed."},
            "metadata": {"timestamp": "2026-09-02T14:01:00Z", "duration_ms": 45, "artifacts_evaluated": ["plan.md"], "model": null, "deterministic": true},
            "state": {}
          }
          ENDJSON

          echo "=== Strict ==="
          python3 scripts/python/compose_results.py --results-dir /tmp/test-results --phase after_plan --strategy strict --json | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['composed_outcome']=='warn', f'Expected warn, got {d[\"composed_outcome\"]}'; print(f'PASS: strict={d[\"composed_outcome\"]}')"

          echo "=== Majority ==="
          python3 scripts/python/compose_results.py --results-dir /tmp/test-results --phase after_plan --strategy majority --json | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['composed_outcome']=='warn', f'Expected warn, got {d[\"composed_outcome\"]}'; print(f'PASS: majority={d[\"composed_outcome\"]}')"

          echo "=== Optimistic ==="
          python3 scripts/python/compose_results.py --results-dir /tmp/test-results --phase after_plan --strategy optimistic --json | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['composed_outcome']=='pass', f'Expected pass, got {d[\"composed_outcome\"]}'; print(f'PASS: optimistic={d[\"composed_outcome\"]}')"

          echo "=== Empty dir ==="
          mkdir -p /tmp/empty-results
          python3 scripts/python/compose_results.py --results-dir /tmp/empty-results --phase after_plan --json | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['composed_outcome']=='pass', f'Expected pass, got {d[\"composed_outcome\"]}'; print(f'PASS: empty={d[\"composed_outcome\"]}')"

  test-bash:
    name: Test Bash Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Test compose-results.sh with sample data
        run: |
          chmod +x scripts/bash/compose-results.sh
          mkdir -p /tmp/test-results

          cat > /tmp/test-results/epistemic-after_plan-20260902T140000Z.json << 'ENDJSON'
          {
            "schema_version": "1.0",
            "evaluator": {"id": "epistemic", "version": "0.1.0", "name": "Epistemic Checker"},
            "phase": "after_plan",
            "outcome": "warn",
            "summary": "Two unsupported claims found.",
            "findings": [
              {"id": "EPI-001", "severity": "high", "kind": "unsupported_claim", "subject": "plan.md#REQ-014", "description": "No evidence.", "evidence_refs": [], "provenance_refs": ["plan.md#REQ-014"], "uncertainty": "medium", "recommended_action": "gather_evidence", "rationale": "No evidence."},
              {"id": "EPI-002", "severity": "medium", "kind": "ambiguous_requirement", "subject": "plan.md#REQ-022", "description": "Undefined term.", "evidence_refs": [], "provenance_refs": ["plan.md#REQ-022"], "uncertainty": "low", "recommended_action": "clarify", "rationale": "Undefined."}
            ],
            "next_action": {"kind": "warn", "target_phase": null, "message": "2 findings."},
            "metadata": {"timestamp": "2026-09-02T14:00:00Z", "duration_ms": 150, "artifacts_evaluated": ["plan.md"], "model": null, "deterministic": true},
            "state": {}
          }
          ENDJSON

          cat > /tmp/test-results/schema-validate-after_plan-20260902T140100Z.json << 'ENDJSON'
          {
            "schema_version": "1.0",
            "evaluator": {"id": "schema-validate", "version": "0.2.0", "name": "Schema Validator"},
            "phase": "after_plan",
            "outcome": "pass",
            "summary": "All artifacts conform.",
            "findings": [],
            "next_action": {"kind": "pass", "target_phase": null, "message": "All passed."},
            "metadata": {"timestamp": "2026-09-02T14:01:00Z", "duration_ms": 45, "artifacts_evaluated": ["plan.md"], "model": null, "deterministic": true},
            "state": {}
          }
          ENDJSON

          echo "=== Strict ==="
          bash scripts/bash/compose-results.sh --results-dir /tmp/test-results --phase after_plan --strategy strict | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['composed_outcome']=='warn', f'Expected warn, got {d[\"composed_outcome\"]}'; print(f'PASS: strict={d[\"composed_outcome\"]}')"

          echo "=== Majority ==="
          bash scripts/bash/compose-results.sh --results-dir /tmp/test-results --phase after_plan --strategy majority | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['composed_outcome']=='warn', f'Expected warn, got {d[\"composed_outcome\"]}'; print(f'PASS: majority={d[\"composed_outcome\"]}')"

          echo "=== Optimistic ==="
          bash scripts/bash/compose-results.sh --results-dir /tmp/test-results --phase after_plan --strategy optimistic | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['composed_outcome']=='pass', f'Expected pass, got {d[\"composed_outcome\"]}'; print(f'PASS: optimistic={d[\"composed_outcome\"]}')"

          echo "=== Empty dir ==="
          mkdir -p /tmp/empty-results
          bash scripts/bash/compose-results.sh --results-dir /tmp/empty-results --phase after_plan | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['composed_outcome']=='pass', f'Expected pass, got {d[\"composed_outcome\"]}'; print(f'PASS: empty={d[\"composed_outcome\"]}')"

  test-powershell:
    name: Test PowerShell Script
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test compose-results.ps1 with sample data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path C:\test-results

          @'
          {
            "schema_version": "1.0",
            "evaluator": {"id": "epistemic", "version": "0.1.0", "name": "Epistemic Checker"},
            "phase": "after_plan",
            "outcome": "warn",
            "summary": "Two unsupported claims found.",
            "findings": [
              {"id": "EPI-001", "severity": "high", "kind": "unsupported_claim", "subject": "plan.md#REQ-014", "description": "No evidence.", "evidence_refs": [], "provenance_refs": ["plan.md#REQ-014"], "uncertainty": "medium", "recommended_action": "gather_evidence", "rationale": "No evidence."},
              {"id": "EPI-002", "severity": "medium", "kind": "ambiguous_requirement", "subject": "plan.md#REQ-022", "description": "Undefined term.", "evidence_refs": [], "provenance_refs": ["plan.md#REQ-022"], "uncertainty": "low", "recommended_action": "clarify", "rationale": "Undefined."}
            ],
            "next_action": {"kind": "warn", "target_phase": null, "message": "2 findings."},
            "metadata": {"timestamp": "2026-09-02T14:00:00Z", "duration_ms": 150, "artifacts_evaluated": ["plan.md"], "model": null, "deterministic": true},
            "state": {}
          }
          '@ | Out-File -Encoding utf8 C:\test-results\epistemic-after_plan-20260902T140000Z.json

          @'
          {
            "schema_version": "1.0",
            "evaluator": {"id": "schema-validate", "version": "0.2.0", "name": "Schema Validator"},
            "phase": "after_plan",
            "outcome": "pass",
            "summary": "All artifacts conform.",
            "findings": [],
            "next_action": {"kind": "pass", "target_phase": null, "message": "All passed."},
            "metadata": {"timestamp": "2026-09-02T14:01:00Z", "duration_ms": 45, "artifacts_evaluated": ["plan.md"], "model": null, "deterministic": true},
            "state": {}
          }
          '@ | Out-File -Encoding utf8 C:\test-results\schema-validate-after_plan-20260902T140100Z.json

          Write-Host "=== Strict ==="
          $result = & .\scripts\powershell\compose-results.ps1 -ResultsDir C:\test-results -Phase after_plan -Strategy strict | ConvertFrom-Json
          if ($result.composed_outcome -ne 'warn') { throw "Expected warn, got $($result.composed_outcome)" }
          Write-Host "PASS: strict=$($result.composed_outcome)"

          Write-Host "=== Majority ==="
          $result = & .\scripts\powershell\compose-results.ps1 -ResultsDir C:\test-results -Phase after_plan -Strategy majority | ConvertFrom-Json
          if ($result.composed_outcome -ne 'warn') { throw "Expected warn, got $($result.composed_outcome)" }
          Write-Host "PASS: majority=$($result.composed_outcome)"

          Write-Host "=== Optimistic ==="
          $result = & .\scripts\powershell\compose-results.ps1 -ResultsDir C:\test-results -Phase after_plan -Strategy optimistic | ConvertFrom-Json
          if ($result.composed_outcome -ne 'pass') { throw "Expected pass, got $($result.composed_outcome)" }
          Write-Host "PASS: optimistic=$($result.composed_outcome)"

          Write-Host "=== Empty dir ==="
          New-Item -ItemType Directory -Force -Path C:\empty-results
          $result = & .\scripts\powershell\compose-results.ps1 -ResultsDir C:\empty-results -Phase after_plan | ConvertFrom-Json
          if ($result.composed_outcome -ne 'pass') { throw "Expected pass, got $($result.composed_outcome)" }
          Write-Host "PASS: empty=$($result.composed_outcome)"